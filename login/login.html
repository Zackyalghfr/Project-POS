<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Warung Lalapan</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header class="auth-header">LOGIN</header>

    <main class="auth-body">

        <figure class="auth-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24"
                fill="none" stroke="#2456a4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </figure>

        <section class="auth-form">
            <label class="input-group">
                <input type="text" id="login-email" placeholder="Username / Email">
                <span id="username-error" class="error-text"></span>
                <span class="icon"><i data-lucide="mail" width="20" height="19"></i></span>
            </label>
            <label class="input-group">
                <input type="password" id="login-pass" placeholder="Password">
                <span id="password-error" class="error-text"></span>
                <span class="icon toggle-pass" onclick="togglePass('login-pass', this)">
                    <i data-lucide="eye-off" width="20" height="20"></i>
                </span>
            </label>
            <div style="height: 8px;"></div>
            <button class="btn-primary" onclick="login()">Masuk</button>
            <p class="auth-link">
                Belum punya akun?
                <a href="../register/register.html">Daftar di sini</a>
            </p>
        </section>

    </main>

    <script src="../shared/shared.js"></script>
    <script src="login.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
