<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi — Warung Lalapan</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="../shared/shared.css">
    <link rel="stylesheet" href="transaksi.css">
</head>
<body>
<div class="app-layout">

    <!-- Topbar -->
    <header class="topbar">
        <div class="topbar-brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
                fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Transaksi
        </div>
        <address class="topbar-user">
            <span id="user-name"></span>
            <div class="user-avatar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
        </address>
    </header>

    <div class="app-body">

        <!-- Sidebar Navigasi -->
        <nav class="sidebar">
            <a class="nav-item" href="../menu/menu.html">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
                        <path d="M7 2v20"/>
                        <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>
                    </svg>
                </span>
                Menu Utama
            </a>
            <a class="nav-item" href="../pesanan/pesanan.html">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"/>
                        <circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                    <span class="badge-count" id="cart-count">0</span>
                </span>
                Pesanan
            </a>
            <a class="nav-item" href="../pembayaran/pembayaran.html">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                        <line x1="1" y1="10" x2="23" y2="10"/>
                    </svg>
                </span>
                Pembayaran
            </a>
            <a class="nav-item active" href="transaksi.html">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                </span>
                Transaksi
            </a>
        </nav>

        <!-- Konten Utama -->
        <main class="main-content">
            <article class="transaction-card">
                <h2 class="grand-total" id="grand-total-txt">Grand Total: Rp. 0</h2>
                <p class="tax-row" id="tax-txt">Pajak (10%): Rp. 0</p>
                <p class="discount-row">Diskon: Rp. 0</p>
                <p class="total-akhir-row" id="total-akhir-txt">Total Akhir: Rp. 0</p>
            </article>

            <h3 class="payment-method-title">Metode Pembayaran Terpilih</h3>
            <section class="qr-card" id="qr-card"></section>

            <div style="height: 20px;"></div>

            <button class="process-btn" onclick="processPayment()">
                Proses Pembayaran [<span id="total-btn">0</span>]
            </button>
        </main>

    </div>
</div>

    <script src="../shared/shared.js"></script>
    <script src="transaksi.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
